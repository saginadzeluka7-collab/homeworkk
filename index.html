<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CogniBloom Collective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <a href="#" class="logo">
            <svg class="logo__icon" viewBox="0 0 48 48" fill="none" stroke="#0e1636" stroke-width="2.5"
                stroke-linecap="round" aria-hidden="true">
                <circle cx="24" cy="24" r="21" />
                <circle cx="24" cy="24" r="4" />
                <path
                    d="M24 20c-2-6-1-10 0-13 1 3 2 7 0 13zM28 22c5-4 9-5 13-4-3 2-7 4-13 4zM27 28c6 1 9 4 10 8-4-1-8-3-10-8zM21 28c-2 5-6 7-10 8 1-4 4-7 10-8zM20 22c-6 0-10-2-13-4 4-1 8 0 13 4z" />

            <span class="logo__sub">Collective</span>

        <nav class="nav">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Get Involved</a>
            <a href="#" class="donate">Donate</a>
        </nav>

        <button class="burger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main class="hero">
        <section class="hero__left">
            <div class="card">
                <h1>Sparking a Universe of Curiosity</h1>
                <p>We believe every child deserves a chance to learn, grow, and dream. Join us in making education a
                    joyful adventure for all.</p>
                <a href="#" class="btn">See Our Impact</a>
            </div>
        </section>

        <section class="hero__right">
            <img src="./assets/8a2b3ecd-75c8-4abc-ab10-5ee445f0c4e0"
                alt="A volunteer reading a picture book to a group of children outdoors">
            <div class="dots" aria-hidden="true">
                <span></span><span class="on"></span><span></span>
            </div>
        </section>
    </main>

</body>

</html>
